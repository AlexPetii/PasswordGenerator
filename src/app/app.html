<div class="container">
  <div class="card">
    <h1>🔐 Password Generator</h1>
    <p>Create a random password</p>

    <div class="password-box">
      <span>
        {{ password() || 'Your password will appear here' }}
      </span>

      <button type="button" (click)="copyPassword()" [disabled]="!password()" title="Copy password">
        Copy
      </button>
    </div>

    @if (copied()) {
      <p class="success">Password copied!</p>
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="settings">
      <label for="length"> Password length: {{ length }} </label>

      <input id="length" type="range" min="4" max="64" [(ngModel)]="length" />

      <label class="option">
        <span>Include numbers (0-9)</span>
        <input type="checkbox" [(ngModel)]="includeNumbers" />
      </label>

      <label class="option">
        <span>Include special characters (!@#$)</span>
        <input type="checkbox" [(ngModel)]="includeSymbols" />
      </label>

      <label class="option">
        <span>Use API Ninjas</span>
        <input type="checkbox" [(ngModel)]="useApi" />
      </label>
    </div>

    <button type="button" class="generate-btn" [disabled]="loading()" (click)="generate()">
      {{ loading() ? 'Generating...' : 'Generate Password' }}
    </button>
  </div>
</div>
